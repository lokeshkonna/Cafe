<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Previous Orders - Our Cafe</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {
    font-family: "DM Sans", sans-serif;

    background: #f8f5f0;

    color: #40251f;
}


.orders-container {
    width: 90%;
    max-width: 1100px;

    margin: 0 auto;

    padding: 40px 0;
}


/* HEADER */

.orders-header {
    margin-bottom: 35px;
}


.back-btn {
    display: inline-flex;

    align-items: center;

    gap: 8px;

    color: #684035;

    text-decoration: none;

    font-size: 14px;

    margin-bottom: 25px;
}


.back-btn:hover {
    color: #40251f;
}


.orders-header h1 {
    font-family: "Playfair Display", serif;

    font-size: 42px;

    margin-bottom: 8px;
}


.orders-header p {
    color: #777;

    font-size: 15px;
}


/* ORDER CARD */

.order-card {

    background: white;

    border-radius: 14px;

    padding: 24px;

    margin-bottom: 20px;

    border: 1px solid #eee;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.06);

    transition: 0.3s;
}


.order-card:hover {
    transform: translateY(-3px);

    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.09);
}


.order-top {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding-bottom: 15px;

    border-bottom: 1px solid #eee;
}


.order-id {
    font-weight: 700;

    color: #40251f;
}


.order-date {
    color: #888;

    font-size: 13px;
}


.order-status {

    padding: 6px 12px;

    border-radius: 20px;

    background: #e8f5e9;

    color: #2e7d32;

    font-size: 12px;

    font-weight: 600;
}


/* TABLE */

.table-info {

    display: flex;

    gap: 20px;

    margin: 17px 0;

    color: #666;

    font-size: 14px;
}


.table-info i {
    color: #684035;
}


/* ITEMS */

.order-items {

    margin-top: 10px;
}


.order-item {

    display: flex;

    justify-content: space-between;

    padding: 10px 0;

    font-size: 14px;

    border-bottom: 1px dashed #eee;
}


.item-name {
    color: #444;
}


.item-price {
    font-weight: 600;
}


/* TOTAL */

.order-bottom {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 18px;
}


.total-label {
    color: #777;

    font-size: 14px;
}


.total-price {

    font-size: 20px;

    font-weight: 700;

    color: #40251f;
}


/* EMPTY */

.empty-orders {

    text-align: center;

    background: white;

    border-radius: 15px;

    padding: 70px 20px;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.05);
}


.empty-icon {

    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border-radius: 50%;

    background: #f0e4dd;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #684035;

    font-size: 28px;
}


.empty-orders h2 {

    font-family: "Playfair Display", serif;

    margin-bottom: 8px;
}


.empty-orders p {

    color: #777;

    margin-bottom: 25px;
}


.order-now-btn {

    display: inline-flex;

    align-items: center;

    gap: 9px;

    padding: 12px 20px;

    border-radius: 7px;

    background: #684035;

    color: white;

    text-decoration: none;

    font-weight: 600;

    font-size: 14px;
}


.order-now-btn:hover {

    background: #40251f;
}


/* MOBILE */

@media (max-width: 600px) {

    .orders-container {
        width: 92%;
        padding: 25px 0;
    }

    .orders-header h1 {
        font-size: 32px;
    }

    .order-top {
        flex-direction: column;

        align-items: flex-start;

        gap: 10px;
    }

    .order-bottom {
        align-items: flex-start;

        gap: 10px;
    }

}
    </style>

</head>


<body>

    <div class="orders-container">

        <!-- Header -->

        <div class="orders-header" style="display:flex; justify-content:space-between; align-items:flex-end;">

            <div>

                <a href="tables.html"
                   class="back-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Tables

                </a>

                <h1>Previous Orders</h1>

                <p>
                    View your recent orders from Our Cafe
                </p>

            </div>

            <div style="display:flex; gap:12px; margin-bottom:10px;">
                <a href="menu-item.html" class="order-now-btn" style="padding:8px 14px; font-size:13px;"><i class="fa-solid fa-utensils"></i> Menu</a>
                <a href="customer_order_status.html" class="order-now-btn" style="padding:8px 14px; font-size:13px; background:#33210d;"><i class="fa-solid fa-clock-rotate-left"></i> Live Status</a>
                <a href="customer_profile.html" class="order-now-btn" style="padding:8px 14px; font-size:13px; background:#40251f;"><i class="fa-solid fa-user"></i> Profile</a>
            </div>

        </div>


        <!-- Orders -->

        <div id="ordersList"
             class="orders-list">

        </div>


        <!-- Empty State -->

        <div id="emptyOrders"
             class="empty-orders">

            <div class="empty-icon">

                <i class="fa-solid fa-receipt"></i>

            </div>

            <h2>No Previous Orders</h2>

            <p>
                You haven't placed any orders yet.
            </p>

            <a href="../tables/tables.html"
               class="order-now-btn">

                Order Now

                <i class="fa-solid fa-arrow-right"></i>

            </a>

        </div>

    </div>

    <script>
        const ordersList =
    document.getElementById("ordersList");

const emptyOrders =
    document.getElementById("emptyOrders");


function loadPreviousOrders() {

    const orders =
        JSON.parse(
            localStorage.getItem("cafeOrders")
        ) || [];


    if (orders.length === 0) {

        ordersList.style.display = "none";

        emptyOrders.style.display = "block";

        return;
    }


    emptyOrders.style.display = "none";

    ordersList.style.display = "block";


    ordersList.innerHTML = "";


    orders.reverse().forEach(order => {

        const card =
            document.createElement("div");

        card.className = "order-card";


        let itemsHTML = "";


        order.items.forEach(item => {

            itemsHTML += `
                <div class="order-item">

                    <span class="item-name">
                        ${item.name}
                        × ${item.quantity}
                    </span>

                    <span class="item-price">
                        ₹${item.price * item.quantity}
                    </span>

                </div>
            `;

        });


        card.innerHTML = `

            <div class="order-top">

                <div>

                    <div class="order-id">
                        Order #${order.id}
                    </div>

                    <div class="order-date">
                        ${order.date}
                    </div>

                </div>

                <span class="order-status">
                    ${order.status || "Completed"}
                </span>

            </div>


            <div class="table-info">

                <span>
                    <i class="fa-solid fa-chair"></i>

                    Table ${order.table}
                </span>

                <span>
                    <i class="fa-solid fa-clock"></i>

                    ${order.time || ""}
                </span>

            </div>


            <div class="order-items">

                ${itemsHTML}

            </div>


            <div class="order-bottom">

                <span class="total-label">
                    Total Amount
                </span>

                <span class="total-price">
                    ₹${order.total}
                </span>

            </div>

        `;


        ordersList.appendChild(card);

    });

}


loadPreviousOrders();
    </script>

</body>

</html>
